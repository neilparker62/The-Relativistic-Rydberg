# An empty front matter block tells GitHub Pages to disable Jekyll parsing completely

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LaTeX Test Page</title>
    
    <!-- Load structural KaTeX stylesheets -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    
    <!-- Load the primary KaTeX equation engine -->
    <script defer src="https://jsdelivr.net"></script>
    
    <!-- Load the official Auto-Render script extension -->
    <script defer src="https://jsdelivr.net"></script>
    
    <!-- Trigger text scanner immediately when the page finishes loading -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', inline: true}
                ],
                throwOnError : false
            });
        });
    </script>
</head>
<body>

    <h1>The Relativistic Rydberg Formula Rendering Test</h1>
    
    <p>Below is the main target display equation:</p>
    
    $$E_n = \mu c^2 \sqrt{1 - \frac{Z^2 \alpha^2}{n^2}}$$

</body>
</html>
